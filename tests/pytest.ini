[pytest]
# --capture=sys, not pytest's default --capture=fd: fd capture dup2()s file
# descriptors 1 and 2 onto temp files and swaps them around each test, and
# Tcl binds its standard channels once per process when the first
# interpreter initializes. Swapping the fds underneath it leaves that global
# state dangling, after which creating a later Tk root intermittently dies
# inside its own startup -- "couldn't read file .../init.tcl: No error",
# "Can't find a usable tk.tcl", or "invalid command name tcl_findLibrary" --
# on a random Tk test, roughly 4 runs in 10. Capturing at the sys.stdout
# level leaves the descriptors alone and keeps the GUI tests deterministic.
addopts = -p no:cacheprovider --capture=sys
testpaths = tests
